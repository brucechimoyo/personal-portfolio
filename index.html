<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Bruce Takura Chimoyo - Full-stack developer and frontend architect. Building performant, accessible web experiences.">
  <meta name="theme-color" content="#05070d">
  <title>Bruce Takura Chimoyo - Developer Portfolio</title>

  <!-- Apply saved / system theme before first paint -->
  <script>
(function(){var s=null;try{s=localStorage.getItem('theme')}catch(e){}var d=s?s==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',d?'dark':'light')})();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.contentful.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/modern.css">

  <link rel="manifest" href="/manifest.json">
</head>
<body>
  <a class="skip-link" href="#feed">Skip to content</a>

  <!-- Ambient animated backdrop -->
  <div class="ambient" aria-hidden="true">
    <span class="ambient-orb ambient-orb-1"></span>
    <span class="ambient-orb ambient-orb-2"></span>
    <span class="ambient-orb ambient-orb-3"></span>
    <span class="ambient-grid"></span>
  </div>
  <div class="scroll-progress" aria-hidden="true"></div>

  <!-- Mobile Header -->
  <header role="banner" class="mobile-header">
    <div class="mobile-header-content">
      <a href="#home" class="brand" aria-label="Home">
        <span class="brand-mark">BTC</span>
      </a>
      <div class="mobile-toggles">
        <button type="button" class="icon-button search-toggle" data-search-toggle aria-label="Search" aria-controls="compact-search" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
        <button id="theme-toggle-mobile" class="theme-toggle icon-button" aria-label="Toggle theme">
          <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
        <button id="color-toggle-mobile" class="color-toggle-mobile icon-button" aria-label="Toggle accent color" aria-haspopup="listbox" aria-expanded="false">
          <span class="color-indicator" id="color-indicator-mobile"></span>
        </button>
        <div id="color-menu-mobile" class="color-menu" role="listbox" aria-label="Color theme options" hidden>
          <button class="color-option" data-color="blue" role="option"><span class="swatch"></span>Blue</button>
          <button class="color-option" data-color="orange" role="option"><span class="swatch"></span>Orange</button>
          <button class="color-option" data-color="green" role="option"><span class="swatch"></span>Green</button>
          <button class="color-option" data-color="red" role="option"><span class="swatch"></span>Red</button>
          <button class="color-option" data-color="purple" role="option"><span class="swatch"></span>Purple</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Left Sidebar Navigation -->
  <nav id="sidebar" role="navigation" aria-label="Main navigation">
    <a href="#home" class="brand sidebar-header" aria-label="Home">
      <span class="brand-mark">BTC</span>
      <span class="brand-text">Chimoyo<span class="brand-dot">.</span>dev</span>
    </a>
    <ul class="nav-list">
      <li>
        <a href="#home" class="nav-item active">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
          <span class="nav-label">Home</span>
        </a>
      </li>
      <li>
        <a href="#projects" class="nav-item">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>
          <span class="nav-label">Projects</span>
        </a>
      </li>
      <li>
        <a href="#articles" class="nav-item">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          <span class="nav-label">Stories</span>
        </a>
      </li>
    </ul>

    <a href="#home" id="nav-cta" class="nav-cta" data-magnetic target="_blank" rel="noopener noreferrer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
      <span class="nav-label">Let's talk</span>
    </a>

    <div class="sidebar-toggles">
      <button id="theme-toggle" class="theme-toggle-desktop icon-button" aria-label="Toggle theme">
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>
      <button id="color-toggle" class="color-toggle-desktop icon-button" aria-label="Toggle accent color" aria-haspopup="listbox" aria-expanded="false">
        <span class="color-indicator" id="color-indicator"></span>
      </button>
      <div id="color-menu" class="color-menu" role="listbox" aria-label="Color theme options" hidden>
        <button class="color-option" data-color="blue" role="option"><span class="swatch"></span>Blue</button>
        <button class="color-option" data-color="orange" role="option"><span class="swatch"></span>Orange</button>
        <button class="color-option" data-color="green" role="option"><span class="swatch"></span>Green</button>
        <button class="color-option" data-color="red" role="option"><span class="swatch"></span>Red</button>
        <button class="color-option" data-color="purple" role="option"><span class="swatch"></span>Purple</button>
      </div>
    </div>

    <a href="#home" class="sidebar-profile">
      <img src="img/hero.jpeg" alt="" class="sidebar-profile-avatar no-lazy" width="40" height="40" decoding="async">
      <span class="sidebar-profile-text">
        <span class="sidebar-profile-name">Bruce Takura Chimoyo</span>
        <span class="sidebar-profile-role">Full-stack developer</span>
      </span>
    </a>
  </nav>

  <!-- Main Feed -->
  <main id="feed" role="main" tabindex="-1">
    <div class="feed-topbar">
      <h2 id="view-title" class="feed-topbar-title">Home</h2>
      <span id="view-subtitle" class="feed-topbar-subtitle"></span>
      <button type="button" class="icon-button search-toggle feed-topbar-action" data-search-toggle aria-label="Search" aria-controls="compact-search" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
    </div>
    <div id="compact-search" class="compact-search" hidden></div>
    <article id="profile-header" style="display: block;"></article>
    <div id="feed-container"></div>
  </main>

  <!-- Right Sidebar -->
  <aside id="rightbar" role="complementary" aria-label="Sidebar">
    <form class="search-box" role="search" onsubmit="return false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <label for="site-search" class="sr-only">Search projects and stories</label>
      <input id="site-search" type="search" placeholder="Search projects & stories" autocomplete="off">
      <kbd class="search-kbd" aria-hidden="true">/</kbd>
    </form>
    <div id="rightbar-content"></div>
  </aside>

  <!-- Mobile bottom tab bar -->
  <nav class="bottom-nav" aria-label="Mobile navigation">
    <a href="#home" class="mobile-nav-item active" aria-label="Home">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
      <span>Home</span>
    </a>
    <a href="#projects" class="mobile-nav-item" aria-label="Projects">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>
      <span>Projects</span>
    </a>
    <a href="#articles" class="mobile-nav-item" aria-label="Stories">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      <span>Stories</span>
    </a>
  </nav>

  <!-- Router outlet for pages -->
  <div id="router-outlet" style="display: none;"></div>

  <!-- Support Chat Widget -->
  <div id="support-chat" class="support-chat" style="display: none;">
    <div class="support-header">
      <h3>Support Chat</h3>
      <button id="support-close" class="support-close" aria-label="Close support chat">×</button>
    </div>
    <div class="support-body">
      <p>How can we help you today?</p>
      <form id="support-form" class="support-form">
        <label for="support-name" class="sr-only">Your name</label>
        <input type="text" id="support-name" placeholder="Your name" required aria-label="Your name">
        <label for="support-message" class="sr-only">Your message</label>
        <textarea id="support-message" placeholder="Your message" required aria-label="Your message"></textarea>
        <button type="submit" class="btn">Send Message</button>
      </form>
      <div id="support-thanks" class="support-thanks hidden">
        <p>Thank you. We'll get back to you soon.</p>
      </div>
    </div>
  </div>

  <!-- Back to Top Button (ring shows scroll progress) -->
  <button id="back-to-top" type="button" class="back-to-top" aria-label="Back to top">
    <svg class="back-to-top-ring" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" pathLength="1"/></svg>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
  </button>

  <script type="module" src="js/main.js"></script>
</body>
</html>
